name: Glancecard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/glancecard.yml']
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-glancecard
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gfazioli/glancecard@14788d177cabef010443a61b25c3774e7be632e5 # v0.6.1
        with:
          profile: WalksWithASwagger
          time-zone: America/Vancouver
          theme: both
